# gradle.properties
#
# What this file does (plain English):
# These are settings that tune HOW Gradle runs the build — not WHAT it builds.
# They affect speed, memory, and compatibility.
#
# org.gradle.jvmargs:
#   Gives Gradle's JVM 2 GB of RAM. Without enough memory, large builds crash
#   with OutOfMemory errors. The G1GC flag uses a modern garbage collector.
#
# org.gradle.parallel:
#   Lets Gradle build multiple modules at the same time. Safe for most projects.
#
# android.useAndroidX:
#   We use AndroidX (the modern "androidx.*" packages), not the old Support Library.
#
# android.enableJetifier:
#   Automatically converts any old Support Library dependencies from third-party
#   libraries into AndroidX. Needed for libraries that haven't updated themselves.
#
# kotlin.code.style:
#   Enforces the official Kotlin coding style for IDE formatting.
#
# android.nonTransitiveRClass:
#   Speeds up builds by not including resources from dependencies in your R class.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
