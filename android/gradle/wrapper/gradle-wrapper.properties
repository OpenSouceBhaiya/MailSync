# gradle/wrapper/gradle-wrapper.properties
#
# What this file does (plain English):
# When you run "./gradlew build", this file tells the Gradle wrapper WHICH
# version of Gradle to download and use. The wrapper downloads it automatically
# the first time — you don't need to install Gradle separately.
#
# distributionUrl: the exact Gradle version to download. "all" includes
#   Gradle's own source code for IDE debugging; use "bin" for smaller download.
#
# Gradle 8.7 is compatible with AGP 8.3.x and Kotlin 1.9.x.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
